<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💼 GajiKu Jepang</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
</head>
<body>
<div class="container">
<header>
  <div class="header-top">
    <div><h1>💼 GajiKu Jepang</h1><p id="subJudul">Pengelola Gaji & Absensi</p></div>
    <select id="pilihBahasa" onchange="gantiBahasa()"><option value="id">🇮🇩</option><option value="en">🇬🇧</option><option value="jp">🇯🇵</option></select>
  </div>
</header>

<section class="card dashboard">
  <h2 id="judulBulan">💴 Pendapatan Bulan Ini</h2>
  <div id="totalGaji" class="total">¥0</div>
  <div id="totalSemua" style="font-size:12px;color:#9ca3af;margin-top:5px">Total Bulan Ini: ¥0</div>
  <div class="target-box">
    <h3 id="judulTarget">🎯 Target Bulanan</h3><div id="targetText">¥250,000</div>
    <div class="progress"><div id="progressBar"></div></div><p id="progressText">0%</p>
    <button onclick="ubahTarget()">✏️ Ubah Target</button>
  </div>
</section>

<section class="card">
  <h2 id="judulInput">📝 Input Kerja</h2>
  <input type="date" id="tanggal">
  <select id="lokasi"><option value="">Pilih Lokasi</option></select>
  <input type="number" inputmode="decimal" step="0.1" id="jumlah" placeholder="Jumlah kamar / jam">
  <button onclick="tambahData()">💾 Simpan</button>
  <button onclick="openPopupLokasi()" style="background:#3b82f6">➕ Tambah Lokasi</button>
  <button onclick="openPopupDaftarLokasi()" style="background:#8b5cf6">👀 Lihat Daftar Lokasi</button>
</section>

<section class="card">
  <h2 id="judulStatistik">📈 Statistik Bulan Ini</h2>
  <div id="statistik"></div>
</section>

<section class="card">
  <h2 id="judulRekap">📅 Rekap Bulanan</h2>
  <button onclick="openPopupRekap()" style="background:#f59e0b">📊 Lihat Riwayat Semua Bulan</button>
  <div id="totalSejakAwal" style="margin-top:12px;padding-top:12px;border-top:1px solid #374151"></div>
  <button onclick="shareLaporan()" style="background:#10b981;margin-top:12px">📤 Share Laporan Bulan Ini</button>
</section>

<section class="card">
  <h2 id="judulKalender">🗓️ Kalender</h2>
  <div class="kalender-nav">
    <button onclick="gantiBulan(-1)">‹</button>
    <span id="bulanTahun"></span>
    <button onclick="gantiBulan(1)">›</button>
  </div>
  <div id="kalender" class="kalender-grid"></div>
</section>

<section class="card">
  <h2 id="judulBackup">💾 Backup</h2>
  <div style="display:flex; gap:8px">
    <button onclick="exportBackup()">⬇️ Export</button>
    <button onclick="document.getElementById('importFile').click()" style="background:#3b82f6">⬆️ Import</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup()">
</section>

</div>

<div id="popupLokasi" class="popup"><h3 id="judulTambahLokasi">➕ Tambah Lokasi Baru</h3>
  <input type="text" id="namaLokasi" placeholder="Nama Lokasi"><input type="number" inputmode="numeric" id="tarifLokasi" placeholder="Tarif">
  <select id="jenisLokasi"><option value="kamar">Per Kamar</option><option value="jam">Per Jam</option><option value="borongan">Borongan</option></select>
  <button onclick="simpanLokasiBaru()">💾 Simpan</button><button onclick="closePopupLokasi()" class="btn-danger">Batal</button>
</div>

<div id="popupDaftarLokasi" class="popup"><h3 id="judulDaftarLokasi">📋 Daftar Lokasi</h3><div id="isiDaftarLokasi"></div><button onclick="closePopupDaftarLokasi()" class="btn-danger">Tutup</button></div>
<div id="popupRekap" class="popup"><h3>📊 Riwayat Pemasukan</h3><div id="isiRekap"></div><button onclick="closePopupRekap()" class="btn-danger">Tutup</button></div>
<div id="popupDetail" class="popup"><h3 id="judulDetail"></h3><div id="isiDetail"></div><button onclick="closePopupDetail()" class="btn-danger">Tutup</button></div>
<div id="popupOverlay2" onclick="closeSemuaPopup()"></div>

<footer>💼 GajiKu Jepang <br>Design by Anamgambut</footer>
<script src="app.js"></script>
</body>
</html>
